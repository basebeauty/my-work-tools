
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>네이버 뉴스 원문 확인</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f6f9;
      padding: 40px 16px;
      text-align: center;
    }
    main {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
    }
    a {
      display: block;
      background: #2766d8;
      color: white;
      padding: 16px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <h2>네이버 뉴스 알림</h2>
    <p>아래 버튼을 누르면 뉴스 원문으로 이동합니다.</p>
    <p id="domain"></p>
    <a id="newsLink" hidden
       rel="noopener noreferrer"
       referrerpolicy="no-referrer">
       뉴스 원문 보기
    </a>
    <p id="status"></p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const rawUrl = params.get("url");
    const link = document.getElementById("newsLink");
    const status = document.getElementById("status");

    try {
      const target = new URL(rawUrl);

      if (target.protocol !== "https:") {
        throw new Error("HTTPS 주소만 허용");
      }

      document.getElementById("domain").textContent =
        "이동할 사이트: " + target.hostname;
      link.href = target.href;
      link.hidden = false;
    } catch (e) {
      status.textContent =
        "뉴스 원문 주소가 없거나 올바르지 않습니다.";
    }
  </script>
</body>
</html>
