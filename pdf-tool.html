<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 병합기 | 나의 업무 도구 모음</title>
  <style>
    :root { color-scheme: light; --navy:#1f3a6d; --blue:#2563eb; --bg:#f4f7fc; --line:#dae3f0; --ink:#182945; --muted:#61718a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; line-height:1.55; }
    .wrap { max-width:930px; margin:auto; padding:36px 20px 70px; }
    .back { display:inline-block; color:var(--navy); text-decoration:none; font-weight:700; margin-bottom:20px; }
    h1 { margin:0 0 6px; color:var(--navy); font-size:clamp(1.8rem,4vw,2.5rem); }
    .subtitle { margin:0 0 26px; color:var(--muted); }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; padding:clamp(18px,4vw,30px); box-shadow:0 12px 35px rgba(31,58,109,.06); }
    .drop { padding:48px 20px; border:2px dashed #93b5ed; background:#f6faff; border-radius:16px; text-align:center; transition:.2s; cursor:pointer; }
    .drop.dragover { border-color:var(--blue); background:#e8f1ff; transform:scale(1.01); }
    .drop:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #f59e0b; outline-offset:3px; }
    .drop-icon { font-size:3rem; line-height:1.2; }
    .drop strong { display:block; font-size:1.15rem; margin:8px 0; }
    .hint { color:var(--muted); font-size:.9rem; }
    button { border:0; border-radius:10px; padding:11px 17px; font:inherit; font-weight:700; cursor:pointer; transition:.18s; }
    .primary { background:var(--blue); color:white; }
    .primary:hover:not(:disabled) { background:#164ac3; }
    .secondary { background:#eaf0fa; color:var(--navy); }
    .secondary:hover:not(:disabled) { background:#dce7f9; }
    .danger { background:#fff0f0; color:#a82e39; }
    .danger:hover:not(:disabled) { background:#ffdddd; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .topline { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin:28px 0 10px; }
    h2 { margin:0; font-size:1.15rem; }
    .count { font-weight:400; color:var(--muted); font-size:.92rem; }
    .list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .item { display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
    .item.dragging { opacity:.45; }
    .item.over { border:2px dashed var(--blue); }
    .handle { color:#8090aa; font-size:1.5rem; cursor:grab; user-select:none; touch-action:none; }
    .fileIcon { font-size:1.65rem; }
    .fileInfo { min-width:0; flex:1; }
    .filename { font-weight:700; overflow-wrap:anywhere; }
    .meta { color:var(--muted); font-size:.85rem; }
    .controls { display:flex; align-items:center; gap:5px; }
    .mini { padding:7px 10px; font-size:.86rem; }
    .empty { padding:25px; text-align:center; background:#fff; border:1px dashed var(--line); border-radius:12px; color:var(--muted); }
    .bottom { margin-top:24px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:15px; }
    .notice { margin-top:25px; border-radius:12px; padding:15px 18px; color:#29517c; background:#eaf3ff; font-size:.91rem; }
    .status { margin-top:15px; min-height:25px; color:var(--navy); font-weight:600; }
    .status.error { color:#b42331; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #aac5ff; border-top-color:var(--blue); border-radius:50%; animation:spin .75s linear infinite; vertical-align:-3px; margin-right:7px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media(max-width:570px){ .item { flex-wrap:wrap; } .controls { margin-left:auto; } .drop { padding:38px 12px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="index.html">← 도구 모음으로 돌아가기</a>
    <h1>📄 PDF 병합기</h1>
    <p class="subtitle">여러 PDF 파일을 원하는 순서대로 정렬해 하나의 문서로 만드세요.</p>
    <section class="panel" aria-label="PDF 파일 선택">
      <div id="dropZone" class="drop" role="button" tabindex="0" aria-label="PDF 파일 추가">
        <div class="drop-icon" aria-hidden="true">📂</div>
        <strong>PDF 파일을 이곳에 끌어다 놓으세요</strong>
        <p class="hint">또는 아래 버튼을 눌러 여러 파일을 선택하세요.</p>
        <button id="chooseButton" class="primary" type="button">PDF 파일 선택</button>
        <input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
      </div>
      <div class="topline">
        <h2>병합할 파일 <span id="count" class="count">0개</span></h2>
        <button type="button" id="clearButton" class="secondary" disabled>모두 삭제</button>
      </div>
      <div id="empty" class="empty">추가된 PDF 파일이 없습니다.</div>
      <ul id="fileList" class="list" aria-label="병합 순서"></ul>
      <div class="bottom">
        <span class="hint">☰ 표시를 끌어서 순서를 바꾸세요. 모바일에서는 ↑ ↓ 버튼을 이용하세요.</span>
        <button type="button" id="mergeButton" class="primary" disabled>PDF 병합하기</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div class="notice">🔒 PDF 파일은 서버로 전송되지 않고 현재 브라우저 안에서만 처리됩니다. 단, 처음 실행할 때 PDF 처리용 라이브러리를 CDN에서 불러오므로 인터넷 연결이 필요합니다.</div>
    </section>
  </main>
  <!-- PDF 내용은 브라우저에서만 다루며 외부 서버로 업로드하지 않습니다. -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    'use strict';
    // 파일 목록: 파일 자체와 미리 읽은 바이너리, 페이지 수를 보관합니다.
    const files = [];
    const $ = id => document.getElementById(id);
    const dropZone = $('dropZone'), input = $('fileInput'), list = $('fileList');
    let busy = false, draggedId = null, nextId = 1;

    // 사용자에게 처리 상태를 알립니다.
    function setStatus(message, isError = false, loading = false) {
      const el = $('status');
      el.className = 'status' + (isError ? ' error' : '');
      el.replaceChildren();
      if (loading) { const icon = document.createElement('span'); icon.className = 'spinner'; el.append(icon); }
      el.append(document.createTextNode(message));
    }
    const formatSize = n => n < 1048576 ? `${(n / 1024).toFixed(1)}KB` : `${(n / 1048576).toFixed(1)}MB`;

    // 파일을 읽어 페이지 수를 확인한 다음 목록에 추가합니다.
    async function addFiles(selected) {
      if (busy) return;
      if (typeof PDFLib === 'undefined') { setStatus('PDF 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.', true); return; }
      busy = true; render();
      let added = 0, rejected = [];
      for (const file of selected) {
        if (!(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) { rejected.push(`${file.name}: PDF 파일이 아닙니다.`); continue; }
        setStatus(`${file.name} 확인 중...`, false, true);
        try {
          const bytes = await file.arrayBuffer();
          // 보호된 PDF 또는 손상된 PDF는 페이지 수 읽기에 실패할 수 있습니다.
          const document = await PDFLib.PDFDocument.load(bytes);
          files.push({ id: nextId++, name: file.name, size: file.size, bytes, pages: document.getPageCount() });
          added++;
        } catch (error) {
          rejected.push(`${file.name}: 열 수 없는 PDF이거나 암호로 보호되어 있습니다.`);
        }
      }
      busy = false; render();
      if (rejected.length) setStatus(`${added}개 추가됨. ${rejected.join(' ')}`, true);
      else setStatus(added ? `${added}개 파일을 추가했습니다.` : '추가된 파일이 없습니다.');
    }

    // 병합 순서에 맞춰 목록을 새로 그립니다. 사용자 입력은 textContent로만 표시합니다.
    function render() {
      list.replaceChildren();
      $('count').textContent = `${files.length}개 · 총 ${files.reduce((n, f) => n + f.pages, 0)}페이지`;
      $('empty').hidden = files.length > 0;
      $('clearButton').disabled = busy || files.length === 0;
      $('mergeButton').disabled = busy || files.length === 0;
      $('chooseButton').disabled = busy;
      dropZone.setAttribute('aria-disabled', String(busy));
      files.forEach((file, index) => {
        const li = document.createElement('li'); li.className = 'item'; li.draggable = !busy; li.dataset.id = file.id;
        const handle = document.createElement('span'); handle.className = 'handle'; handle.textContent = '☰'; handle.title = '드래그하여 순서 변경'; handle.setAttribute('aria-hidden','true');
        const icon = document.createElement('span'); icon.className = 'fileIcon'; icon.textContent = '📄';
        const info = document.createElement('div'); info.className = 'fileInfo';
        const filename = document.createElement('div'); filename.className = 'filename'; filename.textContent = `${index + 1}. ${file.name}`;
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `${file.pages}페이지 · ${formatSize(file.size)}`;
        info.append(filename, meta);
        const buttons = document.createElement('div'); buttons.className = 'controls';
        const up = button('↑', 'secondary mini', () => move(index, index - 1)); up.title = '위로 이동'; up.disabled = busy || index === 0;
        const down = button('↓', 'secondary mini', () => move(index, index + 1)); down.title = '아래로 이동'; down.disabled = busy || index === files.length - 1;
        const remove = button('삭제', 'danger mini', () => { files.splice(index, 1); render(); setStatus('파일을 삭제했습니다.'); }); remove.disabled = busy;
        buttons.append(up, down, remove); li.append(handle, icon, info, buttons);
        li.addEventListener('dragstart', event => { if (busy) { event.preventDefault(); return; } draggedId = file.id; li.classList.add('dragging'); event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', String(file.id)); });
        li.addEventListener('dragover', event => { if (draggedId === null || busy) return; event.preventDefault(); event.dataTransfer.dropEffect = 'move'; li.classList.add('over'); });
        li.addEventListener('dragleave', () => li.classList.remove('over'));
        li.addEventListener('drop', event => { event.preventDefault(); event.stopPropagation(); li.classList.remove('over'); const from = files.findIndex(f => f.id === draggedId); const to = files.findIndex(f => f.id === file.id); if (from !== -1 && to !== -1) move(from, to); draggedId = null; });
        li.addEventListener('dragend', () => { draggedId = null; document.querySelectorAll('.item').forEach(x => x.classList.remove('dragging','over')); });
        list.append(li);
      });
    }
    function button(text, className, click) { const b = document.createElement('button'); b.type = 'button'; b.textContent = text; b.className = className; b.addEventListener('click', click); return b; }
    function move(from, to) { if (busy || to < 0 || to >= files.length || from === to) return; files.splice(to, 0, files.splice(from, 1)[0]); render(); }

    // 각 PDF의 페이지를 현재 목록 순서대로 새 PDF 문서에 복사합니다.
    async function merge() {
      if (busy || !files.length) return;
      if (typeof PDFLib === 'undefined') { setStatus('PDF 처리 라이브러리를 불러오지 못했습니다.', true); return; }
      busy = true; render();
      try {
        const output = await PDFLib.PDFDocument.create();
        for (let i = 0; i < files.length; i++) {
          const source = files[i];
          setStatus(`병합 중... (${i + 1}/${files.length}) ${source.name}`, false, true);
          // 상태 글자가 표시되도록 잠깐 화면 그리기를 허용합니다.
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          const pdf = await PDFLib.PDFDocument.load(source.bytes);
          const pages = await output.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(page => output.addPage(page));
        }
        const mergedBytes = await output.save();
        const blob = new Blob([mergedBytes], { type:'application/pdf' });
        const url = URL.createObjectURL(blob);
        // 로컬 날짜를 YYYYMMDD 형태로 바꿉니다.
        const now = new Date();
        const date = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
        const anchor = document.createElement('a'); anchor.href = url; anchor.download = `병합_${date}.pdf`;
        document.body.append(anchor); anchor.click(); anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        setStatus(`병합이 완료되었습니다. 병합_${date}.pdf 파일을 확인하세요.`);
      } catch (error) {
        console.error('PDF 병합 오류:', error);
        setStatus('병합에 실패했습니다. 손상되었거나 암호가 걸린 PDF가 포함되어 있는지 확인하세요.', true);
      } finally { busy = false; render(); }
    }

    // 파일 선택창 및 파일 끌어놓기 동작을 연결합니다.
    $('chooseButton').addEventListener('click', event => { event.stopPropagation(); if (!busy) input.click(); });
    dropZone.addEventListener('click', event => { if (!busy && event.target !== $('chooseButton')) input.click(); });
    dropZone.addEventListener('keydown', event => { if ((event.key === 'Enter' || event.key === ' ') && !busy && event.target === dropZone) { event.preventDefault(); input.click(); } });
    input.addEventListener('change', async () => { await addFiles([...input.files]); input.value = ''; });
    ['dragenter','dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); if (!busy) dropZone.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', event => { if (!busy) addFiles([...event.dataTransfer.files]); });
    // 페이지 전체에서 파일을 떨어뜨려도 브라우저가 PDF를 직접 열지 않도록 합니다.
    document.addEventListener('dragover', event => event.preventDefault());
    document.addEventListener('drop', event => { event.preventDefault(); if (!busy && !dropZone.contains(event.target) && !list.contains(event.target) && event.dataTransfer.files.length) addFiles([...event.dataTransfer.files]); });
    $('clearButton').addEventListener('click', () => { if (busy) return; files.length = 0; render(); setStatus('모든 파일을 삭제했습니다.'); });
    $('mergeButton').addEventListener('click', merge);
    render();
  </script>
</body>
</html>
